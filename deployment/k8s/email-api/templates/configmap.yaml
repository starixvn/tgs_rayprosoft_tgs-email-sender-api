apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "email-api.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "EmailSetting": {
        "FromMail": "no-reply2@verime99.com",
        "FromName": "no-reply",
        "SmtpServer": "mail.privateemail.com",
        "Port": 587
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "AllowedHosts": "*",
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]