apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "email-api.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "EmailSetting": {
        "FromMail": "no-reply@verime99.com",
        "FromName": "no-reply",
        "SmtpServer": "smtp.gmail.com",
        "Port": 587
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      },
      "AllowedHosts": "*",
    }
